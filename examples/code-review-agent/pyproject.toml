[project]
name = "code-review-agent"
version = "0.1.0"
description = "AI-powered code review agent that helps you write better, more solid software"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.4.11",
    "langchain>=1.2.3",
    "langchain-anthropic>=1.3.1",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.urls]
Repository = "https://github.com/langchain-ai/deepagents/tree/main/examples/code-review-agent"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
